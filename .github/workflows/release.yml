name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.5.0，不含 v）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release version: $VERSION"

      - name: Run offline tests
        run: |
          node tests/smoke-whiteboard.mjs
          node tests/gesture-whiteboard.mjs

      - name: Build package
        run: node package.mjs --version "${{ steps.version.outputs.value }}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          NOTES="docs/RELEASE-NOTES-${VERSION}.md"
          if [ ! -f "$NOTES" ]; then NOTES="docs/RELEASE-NOTES-0.5.0.md"; fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "dist/dsh-whiteboard-${VERSION}.tgz" "dist/install-guide-${VERSION}.md" --clobber
          else
            gh release create "v${VERSION}" \
              "dist/dsh-whiteboard-${VERSION}.tgz" \
              "dist/install-guide-${VERSION}.md" \
              --title "v${VERSION}" \
              --notes-file "$NOTES"
          fi
